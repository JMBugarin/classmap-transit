openapi: 3.1.0
info:
  title: Classmap Transit
  version: 0.1.0
  description: Versioned Santa Cruz METRO departures with explicit freshness. Data from Santa Cruz METRO (CC BY 4.0); no endorsement. A missing prediction does not mean a cancellation.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Process is up, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      operationId: ready
      responses:
        "200": { description: Database reachable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/feed-status:
    get:
      operationId: feedStatus
      responses:
        "200": { description: Published generation and freshness, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/departures:
    get:
      operationId: departures
      parameters:
        - { name: stop, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Upcoming departures. Freshness is recomputed per response, including cache hits; scheduled fallback when predictions are missing or not fresh., content: { application/json: { schema: { $ref: "#/components/schemas/Departures" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/observations:
    get:
      operationId: observations
      description: Captures fetched in the last hour, keyset paginated by id.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Capture page, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Capture" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/ops:
    get:
      operationId: ops
      responses:
        "200": { description: Operator summary, content: { application/json: { schema: { $ref: "#/components/schemas/Ops" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/requeue:
    post:
      operationId: requeue
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: Failed job returned to pending, content: { application/json: { schema: { type: object, required: [requeued], properties: { requeued: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/activity:
    post:
      operationId: recordActivity
      description: Opt-in weekly activity. One row per install and America/Los_Angeles week (Monday start); repeats are ignored. No IP address, schedule, query or location is stored.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Activity" } } }
      responses:
        "204": { description: Recorded or already recorded }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteActivity
      description: Withdrawal. Deletes every week recorded for the install.
      parameters:
        - { name: install, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/vehicles:
    get:
      operationId: vehicles
      description: Latest METRO vehicle positions, polled every 30 s and kept in memory, with the agency's occupancy report when it sends one (empty, many_seats, few_seats, standing, crushed, full, not_accepting).
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                required: [status, vehicles]
                properties:
                  status: { $ref: "#/components/schemas/LiveStatus" }
                  vehicles:
                    type: array
                    items:
                      type: object
                      required: [id, lat, lon]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        trip: { type: string }
                        route: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        bearing: { type: number }
                        time: { type: integer, format: int64 }
                        stop: { type: string }
                        status: { type: string }
                        occupancy: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /v1/alerts:
    get:
      operationId: alerts
      description: METRO service alerts in effect now.
      responses:
        "200":
          description: Alerts in effect
          content:
            application/json:
              schema:
                type: object
                required: [status, alerts]
                properties:
                  status: { $ref: "#/components/schemas/LiveStatus" }
                  alerts:
                    type: array
                    items:
                      type: object
                      required: [id, header]
                      properties:
                        id: { type: string }
                        header: { type: string }
                        description: { type: string }
                        url: { type: string }
                        cause: { type: string }
                        effect: { type: string }
                        routes: { type: array, items: { type: string } }
                        stops: { type: array, items: { type: string } }
                        trips: { type: array, items: { type: string } }
                        periods: { type: array, items: { type: array, items: { type: integer, format: int64 } } }
        "503": { $ref: "#/components/responses/Error" }
  /v1/room-feedback:
    post:
      operationId: recordRoomFeedback
      description: Anonymous feedback on a room page. Stored for review and never published automatically. No IP address, install id, schedule or location is stored; at most 20 per minute and 500 per Pacific day are accepted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoomFeedback" } } }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string } } } } }
  schemas:
    LiveStatus:
      type: object
      required: [source_time, fetched_at, freshness]
      properties:
        source_time: { type: [integer, "null"], format: int64 }
        fetched_at: { type: [string, "null"], format: date-time }
        freshness: { type: string, enum: [fresh, stale, unavailable] }
    RoomFeedback:
      type: object
      additionalProperties: false
      required: [place, kind]
      properties:
        place: { type: string, pattern: "^[a-z0-9-]{1,80}$", description: Web map place id of the room or building }
        kind: { type: string, enum: [easy, unclear, tip, missing], description: "easy: found it without trouble; unclear: the pin or directions were off; tip: a finding tip; missing: a room the map lacks" }
        message: { type: string, maxLength: 280, description: Required for tip and missing; whitespace is collapsed and control characters dropped }
    Activity:
      type: object
      additionalProperties: false
      required: [install, week]
      properties:
        install: { type: string, format: uuid, description: Random version 4 UUID made on the device at opt-in }
        week: { type: string, format: date, description: Monday that starts the America/Los_Angeles week; the current week or up to 5 weeks back }
    Health: { type: object, required: [status], properties: { status: { type: string } } }
    Freshness: { type: string, enum: [fresh, stale, unavailable] }
    Status:
      type: object
      required: [generation, source_time, fetched_at, processed_at, freshness]
      properties:
        generation: { type: [integer, "null"], format: int64 }
        source_time: { type: [integer, "null"], format: int64 }
        fetched_at: { type: [string, "null"], format: date-time }
        processed_at: { type: [string, "null"], format: date-time }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Departure:
      type: object
      required: [trip, stop, time, event_time, kind]
      properties:
        trip: { type: string }
        stop: { type: string }
        time: { type: integer, format: int64 }
        event_time: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [fresh, stale, unavailable, scheduled] }
    Departures:
      type: object
      required: [status, departures]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        departures: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Departure" } }
    Capture:
      type: object
      required: [id, hash, source_time, fetched_at]
      properties:
        id: { type: integer, format: int64 }
        hash: { type: string }
        source_time: { type: [integer, "null"], format: int64 }
        fetched_at: { type: string, format: date-time }
    Ops:
      type: object
      required: [status, jobs, outcomes, schedule]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        jobs: { type: object, additionalProperties: { type: integer } }
        outcomes: { type: object, additionalProperties: { type: integer } }
        schedule: { type: [string, "null"] }
